name: Commit verification metadata

on:
  workflow_run:
    workflows: [Regenerate verification metadata]
    types: [completed]

permissions:
  contents: read

jobs:
  commit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/gradle/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # workflow_run は main の定義で動く。PR のコードは checkout も実行もしない
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # artifact は検証なしで依存を実行したジョブの出力なので、信頼しないデータとして扱う
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-metadata
          path: ${{ runner.temp }}/regenerated
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Compare with the pull request
        id: compare
        run: |
          mkdir "$RUNNER_TEMP/current"
          for file in verification-metadata.xml verification-keyring.keys; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/gradle/$file?ref=$HEAD_SHA" > "$RUNNER_TEMP/current/$file"
          done
          if diff -rq "$RUNNER_TEMP/current" "$RUNNER_TEMP/regenerated"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Review the regenerated metadata
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          python3 .github/scripts/review_verification_metadata.py \
            "$RUNNER_TEMP/current/verification-metadata.xml" \
            "$RUNNER_TEMP/regenerated/verification-metadata.xml" \
            "$RUNNER_TEMP/regenerated/verification-keyring.keys" \
            | tee "$RUNNER_TEMP/review.md" >> "$GITHUB_STEP_SUMMARY"

      # API 経由のコミットは GitHub が署名する。expectedHeadOid で再生成後に更新されたブランチへの書き込みを防ぐ
      # [dependabot skip] がないと、Dependabot はこのコミットのある PR を rebase しなくなる
      - name: Commit through the API
        if: steps.compare.outputs.changed == 'true'
        run: |
          jq -n \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }' \
            --arg repo "$GITHUB_REPOSITORY" \
            --rawfile body "$RUNNER_TEMP/review.md" \
            --rawfile metadata <(base64 -w0 "$RUNNER_TEMP/regenerated/verification-metadata.xml") \
            --rawfile keyring <(base64 -w0 "$RUNNER_TEMP/regenerated/verification-keyring.keys") \
            '{query: $query, variables: {input: {
              branch: {repositoryNameWithOwner: $repo, branchName: env.HEAD_BRANCH},
              expectedHeadOid: env.HEAD_SHA,
              message: {headline: ":lock: Regenerate dependency verification metadata", body: ($body + "\n[dependabot skip]")},
              fileChanges: {additions: [
                {path: "gradle/verification-metadata.xml", contents: $metadata},
                {path: "gradle/verification-keyring.keys", contents: $keyring}
              ]}
            }}}' | gh api graphql --input -

      # GITHUB_TOKEN のコミットでは CI が自動で実行されないので、workflow_dispatch で実行する
      - name: Run CI on the new commit
        if: steps.compare.outputs.changed == 'true'
        run: gh workflow run ci.yml --ref "$HEAD_BRANCH"
