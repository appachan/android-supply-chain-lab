version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    # androidx は公開日が取れず、安定版が更新されなくなるので対象外にする。docs/adr/0002-dependency-verification.md を参照
    # 全更新が verification-metadata.xml を変更するので、PR を分けると互いにコンフリクトする
    groups:
      gradle:
        patterns:
          - '*'
    # temporary: default cooldown experiment
    ignore:
      - dependency-name: gradle-wrapper
      - dependency-name: com.android.application
      - dependency-name: com.android.library
      - dependency-name: com.android.tools.build:gradle

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
