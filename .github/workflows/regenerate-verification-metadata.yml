name: Regenerate verification metadata

on:
  pull_request:

permissions:
  contents: read

jobs:
  regenerate:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'dependabot/gradle/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # 検証なしで新しい依存のコードを実行するので、このジョブには書き込み権限を渡さない
      # 別のリポジトリの子から参照される BOM の POM は 1 回目に記録されないことがあるので、2 回実行する
      # 理由は docs/adr/0002-dependency-verification.md を参照
      - name: Regenerate
        run: |
          ./gradlew --write-verification-metadata pgp,sha256 --export-keys --write-locks build
          ./gradlew --write-verification-metadata pgp,sha256 --export-keys --write-locks build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: |
            gradle/verification-metadata.xml
            gradle/verification-keyring.keys
            **/gradle.lockfile
          if-no-files-found: error
